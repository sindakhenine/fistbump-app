<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" width="96" height="96">
  <!-- Hot Scale: a round gauge from cold blue to hot red with its needle, over a slider with a glossy knob. -->
  <defs>
    <linearGradient id="rim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#c9d3e6"/>
    </linearGradient>
    <linearGradient id="dial" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2b3350"/><stop offset="1" stop-color="#121728"/>
    </linearGradient>
    <linearGradient id="needle" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#ffd23f"/>
    </linearGradient>
    <radialGradient id="hub" cx="0.36" cy="0.3" r="0.8">
      <stop offset="0" stop-color="#fff6ad"/><stop offset="0.55" stop-color="#ffcf24"/><stop offset="1" stop-color="#c98500"/>
    </radialGradient>
    <linearGradient id="track" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2f97ff"/><stop offset="0.5" stop-color="#ffd23f"/><stop offset="1" stop-color="#ff3d3d"/>
    </linearGradient>
    <radialGradient id="knob" cx="0.36" cy="0.3" r="0.8">
      <stop offset="0" stop-color="#ffffff"/><stop offset="0.6" stop-color="#eef2f7"/><stop offset="1" stop-color="#aab4c6"/>
    </radialGradient>
  </defs>
  <ellipse cx="48" cy="91" rx="34" ry="3.6" fill="#000" opacity="0.2"/>
  <!-- The gauge: half a circle. -->
  <path d="M6 58 A42 42 0 0 1 90 58 V60 a4 4 0 0 1 -4 4 H10 a4 4 0 0 1 -4 -4 Z" fill="url(#rim)" stroke="#8d99b3" stroke-width="1.3"/>
  <path d="M12 58 A36 36 0 0 1 84 58 Z" fill="url(#dial)"/>
  <!-- Five bands, cold to hot. -->
  <g fill="none" stroke-width="10" stroke-linecap="butt">
    <path d="M17 58 A31 31 0 0 1 22.9 39.8" stroke="#2f97ff"/>
    <path d="M24.1 38.2 A31 31 0 0 1 38.4 28.5" stroke="#3ee6c0"/>
    <path d="M40.4 27.9 A31 31 0 0 1 55.6 27.9" stroke="#ffd23f"/>
    <path d="M57.6 28.5 A31 31 0 0 1 71.9 38.2" stroke="#ff8f2e"/>
    <path d="M73.1 39.8 A31 31 0 0 1 79 58" stroke="#ff3d3d"/>
  </g>
  <path d="M19 44 A33 33 0 0 1 46 23.4" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" opacity="0.55"/>
  <!-- The needle, pointing at the hot side. -->
  <path d="M45.4 56.4 L66 33.6 L50.6 59.6 Z" fill="url(#needle)" stroke="#8a5a00" stroke-width="0.9" stroke-linejoin="round"/>
  <circle cx="48" cy="58" r="6.2" fill="url(#hub)" stroke="#9a6200" stroke-width="1"/>
  <ellipse cx="46" cy="55.8" rx="2" ry="1.2" fill="#fff" transform="rotate(-30 46 55.8)"/>
  <!-- The slider under it. -->
  <rect x="10" y="74" width="76" height="9" rx="4.5" fill="url(#track)" stroke="#1b2130" stroke-width="1.1"/>
  <path d="M15 76.6 H60" stroke="#fff" stroke-width="1.8" stroke-linecap="round" opacity="0.6"/>
  <circle cx="64" cy="78.5" r="8.6" fill="url(#knob)" stroke="#7f8aa1" stroke-width="1.2"/>
  <ellipse cx="61.4" cy="75.4" rx="3" ry="1.7" fill="#fff" transform="rotate(-30 61.4 75.4)"/>
  <circle cx="64" cy="78.5" r="2.6" fill="#ff8f2e"/>
</svg>
