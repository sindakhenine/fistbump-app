<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" width="96" height="96">
  <!-- Speed Pool: a small pool table from above, a rack of four glossy balls, the cue ball and a cue. -->
  <defs>
    <linearGradient id="wood" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffcf7a"/><stop offset="0.5" stop-color="#e08a2c"/><stop offset="1" stop-color="#9a4f10"/>
    </linearGradient>
    <radialGradient id="felt" cx="0.4" cy="0.3" r="0.9">
      <stop offset="0" stop-color="#5df0a4"/><stop offset="0.6" stop-color="#16b56b"/><stop offset="1" stop-color="#0a7a48"/>
    </radialGradient>
    <radialGradient id="white" cx="0.36" cy="0.3" r="0.8">
      <stop offset="0" stop-color="#ffffff"/><stop offset="0.7" stop-color="#eef2f7"/><stop offset="1" stop-color="#b9c3d1"/>
    </radialGradient>
    <radialGradient id="yellow" cx="0.36" cy="0.3" r="0.8">
      <stop offset="0" stop-color="#fff6ad"/><stop offset="0.55" stop-color="#ffcf24"/><stop offset="1" stop-color="#c98500"/>
    </radialGradient>
    <radialGradient id="red" cx="0.36" cy="0.3" r="0.8">
      <stop offset="0" stop-color="#ffb3a6"/><stop offset="0.55" stop-color="#ff4d3d"/><stop offset="1" stop-color="#a81508"/>
    </radialGradient>
    <radialGradient id="blue" cx="0.36" cy="0.3" r="0.8">
      <stop offset="0" stop-color="#b7e6ff"/><stop offset="0.55" stop-color="#2f97ff"/><stop offset="1" stop-color="#0a4fb0"/>
    </radialGradient>
    <radialGradient id="black" cx="0.36" cy="0.3" r="0.8">
      <stop offset="0" stop-color="#7c8799"/><stop offset="0.5" stop-color="#262c38"/><stop offset="1" stop-color="#07090d"/>
    </radialGradient>
    <linearGradient id="cue" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fff0c2"/><stop offset="0.7" stop-color="#f1c26b"/><stop offset="1" stop-color="#7a3d12"/>
    </linearGradient>
  </defs>
  <ellipse cx="48" cy="88" rx="38" ry="4.5" fill="#000" opacity="0.2"/>
  <!-- The rail and the felt. -->
  <rect x="6" y="20" width="84" height="58" rx="13" fill="url(#wood)" stroke="#7a3d12" stroke-width="1.4"/>
  <rect x="13" y="27" width="70" height="44" rx="7" fill="url(#felt)" stroke="#07693c" stroke-width="1.2"/>
  <path d="M12 26 H70" stroke="#fff" stroke-width="2.4" stroke-linecap="round" opacity="0.55" transform="translate(4 -2.6)"/>
  <!-- Six pockets. -->
  <g fill="#0b1a12">
    <circle cx="14.5" cy="28.5" r="4.2"/><circle cx="48" cy="26.6" r="3.8"/><circle cx="81.5" cy="28.5" r="4.2"/>
    <circle cx="14.5" cy="69.5" r="4.2"/><circle cx="48" cy="71.4" r="3.8"/><circle cx="81.5" cy="69.5" r="4.2"/>
  </g>
  <!-- The rack of four: a diamond. -->
  <ellipse cx="62" cy="52.5" rx="13" ry="3" fill="#053d24" opacity="0.35"/>
  <circle cx="54" cy="49" r="6.2" fill="url(#yellow)"/>
  <circle cx="63.6" cy="43.4" r="6.2" fill="url(#red)"/>
  <circle cx="63.6" cy="54.6" r="6.2" fill="url(#black)"/>
  <circle cx="73.2" cy="49" r="6.2" fill="url(#blue)"/>
  <circle cx="63.6" cy="54.6" r="2.6" fill="#fff"/>
  <g fill="#fff" opacity="0.9">
    <ellipse cx="51.8" cy="46.4" rx="2" ry="1.2" transform="rotate(-30 51.8 46.4)"/>
    <ellipse cx="61.4" cy="40.8" rx="2" ry="1.2" transform="rotate(-30 61.4 40.8)"/>
    <ellipse cx="61.2" cy="51.6" rx="1.7" ry="1" transform="rotate(-30 61.2 51.6)"/>
    <ellipse cx="71" cy="46.4" rx="2" ry="1.2" transform="rotate(-30 71 46.4)"/>
  </g>
  <!-- The cue ball and the cue. -->
  <circle cx="30" cy="55" r="6.2" fill="url(#white)" stroke="#9aa6b6" stroke-width="0.6"/>
  <ellipse cx="27.8" cy="52.4" rx="2" ry="1.2" fill="#fff" transform="rotate(-30 27.8 52.4)"/>
  <g transform="rotate(24 30 55)">
    <rect x="-22" y="52.6" width="44" height="4.8" rx="2.4" fill="url(#cue)" stroke="#7a3d12" stroke-width="0.8" transform="translate(-4 0)"/>
    <rect x="15.4" y="52.6" width="4.6" height="4.8" rx="1.6" fill="#3ee6ff" stroke="#0b8fb6" stroke-width="0.7"/>
  </g>
</svg>
