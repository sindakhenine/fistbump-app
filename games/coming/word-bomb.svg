<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" width="96" height="96">
  <!-- Word Bomb: a round glossy bomb with a lit fuse, and a letter tile with two letters on it. -->
  <defs>
    <radialGradient id="bomb" cx="0.34" cy="0.28" r="0.85">
      <stop offset="0" stop-color="#8f9ab8"/><stop offset="0.4" stop-color="#3a4260"/><stop offset="1" stop-color="#0c0f1c"/>
    </radialGradient>
    <linearGradient id="cap" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e6ecf7"/><stop offset="1" stop-color="#8793ab"/>
    </linearGradient>
    <radialGradient id="spark" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffffff"/><stop offset="0.4" stop-color="#ffe45c"/><stop offset="1" stop-color="#ff7a1a"/>
    </radialGradient>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#ffe9a8"/>
    </linearGradient>
    <radialGradient id="shine" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fff" stop-opacity="0.9"/><stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <ellipse cx="46" cy="90" rx="30" ry="4.2" fill="#000" opacity="0.22"/>
  <!-- The fuse and its spark. -->
  <path d="M58 22 C62 12 70 10 76 14" fill="none" stroke="#c98a3a" stroke-width="4" stroke-linecap="round"/>
  <path d="M58 22 C62 12 70 10 76 14" fill="none" stroke="#fff0c2" stroke-width="1.4" stroke-linecap="round" stroke-dasharray="2 4"/>
  <path d="M80 2 L82.6 9.4 L90 7 L85.6 13.4 L92 17 L84.4 18 L85 26 L79.6 20.4 L74 26 L75 18.2 L68 16 L74.6 13 L71 6.4 L78 9.6 Z" fill="url(#spark)" stroke="#e05a00" stroke-width="0.9" stroke-linejoin="round"/>
  <circle cx="80" cy="15" r="3.2" fill="#fff"/>
  <!-- The bomb. -->
  <rect x="48" y="17" width="17" height="11" rx="3.4" fill="url(#cap)" stroke="#4b556b" stroke-width="1.1" transform="rotate(24 56.5 22.5)"/>
  <circle cx="44" cy="55" r="33" fill="url(#bomb)" stroke="#05070d" stroke-width="1.2"/>
  <ellipse cx="30" cy="38" rx="13" ry="7" fill="url(#shine)" transform="rotate(-34 30 38)"/>
  <path d="M20 68 C26 78 38 83 50 81" fill="none" stroke="#9fb0e0" stroke-width="2.4" stroke-linecap="round" opacity="0.35"/>
  <!-- The letter tile: A and I, drawn as shapes. -->
  <g transform="rotate(-8 46 60)">
    <rect x="27" y="47" width="38" height="26" rx="7" fill="url(#tile)" stroke="#c98500" stroke-width="1.4"/>
    <path d="M32 50.4 H52" stroke="#fff" stroke-width="2" stroke-linecap="round"/>
    <path d="M34 68 L41 52 L48 68 M36.8 62.6 H45.2" fill="none" stroke="#1b2130" stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M56.5 52 V68" fill="none" stroke="#1b2130" stroke-width="3.6" stroke-linecap="round"/>
  </g>
</svg>
