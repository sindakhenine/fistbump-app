<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" width="96" height="96">
  <!-- Speed Pool's sign: the black ball with its white dot, the yellow ball behind it. -->
  <defs>
    <radialGradient id="yellow" cx="0.36" cy="0.3" r="0.8">
      <stop offset="0" stop-color="#fff6ad"/><stop offset="0.55" stop-color="#ffcf24"/><stop offset="1" stop-color="#c98500"/>
    </radialGradient>
    <radialGradient id="black" cx="0.36" cy="0.3" r="0.8">
      <stop offset="0" stop-color="#7c8799"/><stop offset="0.5" stop-color="#262c38"/><stop offset="1" stop-color="#07090d"/>
    </radialGradient>
    <radialGradient id="dot" cx="0.4" cy="0.35" r="0.8">
      <stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#cfd6e0"/>
    </radialGradient>
  </defs>
  <ellipse cx="48" cy="86" rx="34" ry="5" fill="#000" opacity="0.2"/>
  <circle cx="64" cy="38" r="24" fill="url(#yellow)" stroke="#a86f00" stroke-width="1.2"/>
  <ellipse cx="55" cy="26" rx="8" ry="4.6" fill="#fff" opacity="0.9" transform="rotate(-30 55 26)"/>
  <circle cx="38" cy="54" r="30" fill="url(#black)" stroke="#05070a" stroke-width="1.2"/>
  <circle cx="40" cy="56" r="12" fill="url(#dot)"/>
  <ellipse cx="26" cy="38" rx="10" ry="5.6" fill="#fff" opacity="0.85" transform="rotate(-30 26 38)"/>
</svg>
