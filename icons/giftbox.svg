<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96">
  <!-- The Fistbump shop: the purple gift box with its gold bow (the real box of the keychain). -->
  <defs>
    <linearGradient id="box" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9b5cf0"/><stop offset="0.55" stop-color="#7434cf"/><stop offset="1" stop-color="#4c1d95"/>
    </linearGradient>
    <linearGradient id="lid" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c39bff"/><stop offset="0.5" stop-color="#8f4ff0"/><stop offset="1" stop-color="#6427c4"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff0a8"/><stop offset="0.5" stop-color="#f8c33c"/><stop offset="1" stop-color="#d88a0c"/>
    </linearGradient>
    <linearGradient id="bow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff3b4"/><stop offset="0.45" stop-color="#fbc93f"/><stop offset="1" stop-color="#d27f08"/>
    </linearGradient>
    <radialGradient id="knot" cx="0.4" cy="0.35" r="0.8">
      <stop offset="0" stop-color="#fff6c4"/><stop offset="0.6" stop-color="#f6b92e"/><stop offset="1" stop-color="#c97707"/>
    </radialGradient>
  </defs>
  <ellipse cx="48" cy="89" rx="33" ry="4.5" fill="#2a0f57" opacity="0.2"/>
  <!-- The box. -->
  <path d="M16 46 H80 V80 a7 7 0 0 1 -7 7 H23 a7 7 0 0 1 -7 -7 Z" fill="url(#box)" stroke="#35126e" stroke-width="1.5" stroke-linejoin="round"/>
  <path d="M16 46 H80 V53 H16 Z" fill="#2a0f57" opacity="0.28"/>
  <!-- The ribbon down the front. -->
  <path d="M40.5 46 H55.5 V87 H40.5 Z" fill="url(#gold)" stroke="#a86400" stroke-width="1.2" stroke-linejoin="round"/>
  <path d="M44 55 V82" stroke="#fff" stroke-width="2.2" stroke-linecap="round" opacity="0.6"/>
  <!-- The lid, a little wider than the box. -->
  <rect x="10" y="31" width="76" height="17" rx="6" fill="url(#lid)" stroke="#35126e" stroke-width="1.5"/>
  <path d="M40.5 31 H55.5 V48 H40.5 Z" fill="url(#gold)" stroke="#a86400" stroke-width="1.2" stroke-linejoin="round"/>
  <path d="M16 36 H34" stroke="#fff" stroke-width="2.8" stroke-linecap="round" opacity="0.65"/>
  <path d="M61 36 H72" stroke="#fff" stroke-width="2.8" stroke-linecap="round" opacity="0.4"/>
  <!-- The bow: two tails, two loops and the knot. -->
  <path d="M45 28 C39 33 33 37 27 44 L35.5 43 L38 50 C42 43 46 36 51 30 Z" fill="url(#gold)" stroke="#a86400" stroke-width="1.2" stroke-linejoin="round"/>
  <path d="M51 28 C57 33 63 37 69 44 L60.5 43 L58 50 C54 43 50 36 45 30 Z" fill="url(#gold)" stroke="#a86400" stroke-width="1.2" stroke-linejoin="round"/>
  <path d="M46 25 C38 9 21 5 15 13 C10 20 17 31 30 31 C37 31 43 29 46 25 Z" fill="url(#bow)" stroke="#a86400" stroke-width="1.4" stroke-linejoin="round"/>
  <path d="M50 25 C58 9 75 5 81 13 C86 20 79 31 66 31 C59 31 53 29 50 25 Z" fill="url(#bow)" stroke="#a86400" stroke-width="1.4" stroke-linejoin="round"/>
  <path d="M41 24 C36 17 29 14 24 16.5 C21.5 18.5 23 23 28 24.5 C32.5 25.8 37.5 25.5 41 24 Z" fill="#b96c05" opacity="0.55"/>
  <path d="M55 24 C60 17 67 14 72 16.5 C74.500 18.5 73 23 68 24.5 C63.5 25.8 58.500 25.5 55 24 Z" fill="#b96c05" opacity="0.55"/>
  <path d="M19.500 15.500 C23 11 30 11 35 14" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round" opacity="0.8"/>
  <path d="M61 13.500 C66 10.500 73 11 76.500 14.500" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round" opacity="0.7"/>
  <rect x="41" y="18.500" width="14" height="14" rx="5.500" fill="url(#knot)" stroke="#a86400" stroke-width="1.4"/>
  <path d="M44.500 22.500 C45.500 21.300 47.500 21 49 21.500" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" opacity="0.85"/>
  <!-- The box's shine. -->
  <path d="M22 58 V76" stroke="#fff" stroke-width="3" stroke-linecap="round" opacity="0.35"/>
  <path d="M73 60 V70" stroke="#fff" stroke-width="2.4" stroke-linecap="round" opacity="0.18"/>
</svg>
