<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96">
  <!-- World Partners on the map: a little shop with a sun awning (the colour of "Sponsored"). -->
  <defs>
    <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fffdf4"/><stop offset="1" stop-color="#ecdfbd"/>
    </linearGradient>
    <linearGradient id="sun" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffe58a"/><stop offset="0.55" stop-color="#f5bd4f"/><stop offset="1" stop-color="#d9911a"/>
    </linearGradient>
    <linearGradient id="cream" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#f3e7c9"/>
    </linearGradient>
    <linearGradient id="door" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4f9a7f"/><stop offset="1" stop-color="#1e3a2c"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#d7f4fd"/><stop offset="1" stop-color="#23b9e9"/>
    </linearGradient>
    <linearGradient id="roof" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3f7a63"/><stop offset="1" stop-color="#1e3a2c"/>
    </linearGradient>
  </defs>
  <ellipse cx="48" cy="88" rx="34" ry="4.5" fill="#1e3a2c" opacity="0.16"/>
  <!-- The wall. -->
  <path d="M17 44 H79 V80 a5 5 0 0 1 -5 5 H22 a5 5 0 0 1 -5 -5 Z" fill="url(#wall)" stroke="#a9853a" stroke-width="1.4" stroke-linejoin="round"/>
  <!-- The door and the two windows. -->
  <path d="M39 85 V62 a4 4 0 0 1 4 -4 h10 a4 4 0 0 1 4 4 V85 Z" fill="url(#door)" stroke="#16291f" stroke-width="1.2" stroke-linejoin="round"/>
  <circle cx="52.6" cy="72.5" r="1.7" fill="#ffd96b"/>
  <rect x="22.5" y="58" width="12" height="14" rx="3" fill="url(#glass)" stroke="#0b5f7d" stroke-width="1.1"/>
  <rect x="61.5" y="58" width="12" height="14" rx="3" fill="url(#glass)" stroke="#0b5f7d" stroke-width="1.1"/>
  <path d="M25 61.2 h4.6 M64 61.2 h4.6" stroke="#fff" stroke-width="2" stroke-linecap="round" opacity="0.85"/>
  <!-- The awning: five stripes, sun and cream, each ending in a round scallop. -->
  <path d="M19 18 H77 L88 44 a8 8 0 0 1 -16 0 a8 8 0 0 1 -16 0 a8 8 0 0 1 -16 0 a8 8 0 0 1 -16 0 a8 8 0 0 1 -16 0 Z" fill="url(#sun)" stroke="#9a6200" stroke-width="1.4" stroke-linejoin="round"/>
  <path d="M30.6 18 H42.2 L40 44 a8 8 0 0 1 -16 0 Z" fill="url(#cream)"/>
  <path d="M53.8 18 H65.4 L72 44 a8 8 0 0 1 -16 0 Z" fill="url(#cream)"/>
  <path d="M19 18 H77 L88 44 a8 8 0 0 1 -16 0 a8 8 0 0 1 -16 0 a8 8 0 0 1 -16 0 a8 8 0 0 1 -16 0 a8 8 0 0 1 -16 0 Z" fill="none" stroke="#9a6200" stroke-width="1.4" stroke-linejoin="round"/>
  <!-- The roof bar and its light. -->
  <rect x="15" y="11" width="66" height="9" rx="4.5" fill="url(#roof)" stroke="#16291f" stroke-width="1.2"/>
  <path d="M21 14.4 H60" stroke="#fff" stroke-width="2.2" stroke-linecap="round" opacity="0.55"/>
  <path d="M17.5 30 C22 26.5 30 24.6 40 24.2" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round" opacity="0.6"/>
</svg>
